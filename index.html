<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e4f4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zikir">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Daily Zikir</title>
<style>
:root{--bg:#e4f4ec;--bg2:#fcf3e8;--card:#fffdf9;--line:#cfe5d9;--gold:#c97f58;--text:#3b4d45;--muted:#7a9187;--ok:#47a877}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:var(--bg2);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 28px);background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 2px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
header .date{font-size:12px;color:var(--muted);margin-top:2px}
.streak{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--gold);font-weight:600}
.week{display:flex;gap:6px;justify-content:space-between;margin:6px 0 10px}
.day{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.day i{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.day i b{display:block;height:100%;background:var(--gold)}
.day.full i b{background:var(--ok)}
.day.future{opacity:.45}
.day.today{color:var(--gold);font-weight:700;background:#fde8da;border-radius:10px;padding:3px 3px 5px;margin:-3px 0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:8px 4px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;font-weight:600;text-align:center}
.tab small{display:block;font-size:10px;font-weight:400;margin-top:2px}
.tab.active{background:var(--card);color:var(--text);border-color:var(--gold)}
.tab.done small{color:var(--ok)}
main{display:flex;flex-direction:column}
.hero{box-shadow:0 6px 18px rgba(120,160,140,.18);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative}
.hero:active{transform:scale(.99)}
.ar{font-family:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;direction:rtl;line-height:1.8;color:var(--gold);font-size:23px;line-height:1.7;margin:0 0 4px}
.ar.big{font-size:28px}
.ms{font-size:12px;color:var(--muted);margin:0 0 10px;max-width:90%}
.ring{position:relative;width:150px;height:150px;margin:2px 0}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{font-size:13px;color:var(--muted);margin-top:4px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.complete{color:var(--ok);font-weight:700;font-size:15px;margin-top:6px}
.actions{display:flex;gap:10px;margin:10px 0 8px}
.btn{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px}
.btn:active{background:var(--line)}
.chips{display:flex;gap:8px;margin-bottom:10px}
.chip{flex:1;padding:8px 6px;border-radius:12px;border:1px solid var(--line);font-size:12px;text-align:center;color:var(--muted);background:transparent}
.chip.sel{border-color:var(--gold);color:var(--text);background:var(--card)}
.chip.done{color:var(--ok)}
.chip .a{font-size:14px;font-weight:600;line-height:1.5;display:block;white-space:nowrap;overflow:hidden;color:inherit}
.mulk-btn{width:150px;height:150px;border-radius:50%;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:44px;margin:10px 0;background:transparent;color:var(--gold)}
.mulk-btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.prayer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:10px}
.prow{display:flex;align-items:center;gap:6px}
.pstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:10px}
.pc{text-align:center;padding:8px 2px 7px;border-radius:12px;font-size:12px;color:var(--muted);line-height:1.3;background:#eef8f2;grid-column:span 3}
.pc.w4{grid-column:span 4}
.pc b{display:block;font-size:21px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;margin-top:1px}
.pc i{font-style:normal;font-size:11px;font-weight:500;margin-left:3px;color:var(--muted)}
.pc.tap{cursor:pointer}
.pc.sel{box-shadow:inset 0 -2px 0 var(--gold)}
.slothd{font-size:15px;font-weight:700;margin:0 2px 8px}
.slothd span{font-weight:400;color:var(--muted);font-size:13px}
.slothd em{font-style:normal;color:var(--ok);font-size:13px}
.pc.next{background:#fde8da;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pc.next i{color:var(--gold)}
.pc.next b{color:var(--gold)}
.pc.passed b{color:var(--muted)}
.prayer .pinfo{flex:1;min-width:0}
.prayer .pinfo b{display:block;font-size:14px}
.prayer .pinfo span{font-size:11px;color:var(--muted)}
.prayer button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;height:34px;min-width:34px;padding:0 8px;font-size:13px}
.prayer button.on{border-color:var(--gold);color:var(--gold)}
.times{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.times .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:2px}
.times .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e1efe7;font-size:15px;font-variant-numeric:tabular-nums}
.times .row:last-child{border-bottom:0}
.times .row.next{color:var(--gold);font-weight:700}
.times .row.passed{color:var(--muted)}
.hj{color:var(--gold);font-size:12px;margin-top:1px}
input{-webkit-user-select:text;user-select:text}
.btn.plus{border-color:var(--gold);color:var(--gold);font-weight:600}
.sheetbg{position:fixed;inset:0;background:rgba(40,60,50,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheetbg.show{display:flex}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -8px 24px rgba(0,0,0,.15)}
.sheet h3{margin:0 0 4px;font-size:16px}
.sheet p{margin:0 0 12px;font-size:12px;color:var(--muted)}
.sheet input{width:100%;font-size:28px;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);outline:none}
.sheet input:focus{border-color:var(--gold)}
.presets{display:flex;gap:8px;margin:10px 0}
.presets button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px}
.srow{display:flex;gap:10px}
.btn.go{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
.azanrow{display:flex;gap:6px;align-items:center;margin:-2px 0 4px}
.azanrow button,.azanrow select{height:36px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit}
.azanrow select{flex:1;min-width:0}
.azanrow button.on{border-color:var(--gold);color:var(--gold);font-weight:600}
.aznote{font-size:11px;color:var(--muted);margin:0 2px 10px}
.kahf{display:flex;align-items:center;gap:12px;background:#fff3e1;border:1px solid #f0d8b4;border-radius:14px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.kahf .kt{flex:1;min-width:0}
.kahf .kt b{display:block;font-size:15px}
.kahf .kt span{font-size:12px;color:var(--muted)}
.kahf .ka{font-family:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;font-size:22px;color:var(--gold);direction:rtl}
.kahf .kc{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold);flex:none}
.kahf.done{background:#e8f6ee;border-color:#bfe3cf}
.kahf.done .kc{background:var(--ok);border-color:var(--ok);color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div><h1>Daily Zikir</h1><div class="date" id="date"></div></div>
  <div class="streak" id="streak"></div>
</header>
<div class="week" id="week"></div>
<div class="prayer" id="prayer"></div>
<div class="azanrow">
  <button id="azTog" onclick="toggleAzan()">🔊 Azan: Off</button>
  <select id="azSel" onchange="setAz(this.value)"><option value="makkah">Makkah</option><option value="a2">Azan 2</option><option value="a3">Azan 3</option></select>
  <button id="azPlay" onclick="testAzan()">▶ Test</button>
</div>
<div id="kahf"></div>
<div class="aznote">Azan plays at Subuh, Zohor, Asar, Maghrib &amp; Isyak while the app is open. Subuh uses its own Fajr azan.</div>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div class="sheetbg" id="sheet" onclick="if(event.target===this)closeAdd()">
  <div class="sheet">
    <h3 id="sheetTitle">Add count done outside the app</h3>
    <p id="sheetSub"></p>
    <input id="addN" type="number" inputmode="numeric" min="1" placeholder="How many?">
    <div class="presets">
      <button onclick="setAdd(10)">+10</button><button onclick="setAdd(33)">+33</button><button onclick="setAdd(50)">+50</button><button onclick="setAdd(99999)">Finish all</button>
    </div>
    <div class="srow"><button class="btn" onclick="closeAdd()">Cancel</button><button class="btn go" onclick="doAdd()">Add</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ITEMS = {
  z1:{ar:"سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ",ms:"Glory be to Allah, all praise is for Allah, there is no god but Allah, Allah is the Greatest",short:"Tasbih",target:100},
  z2:{ar:"أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ",ms:"I seek forgiveness from Allah the Almighty",short:"Istighfar",target:100},
  z3:{ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ",ms:"O Allah, send blessings upon Muhammad and upon the family of Muhammad",short:"Selawat",target:100},
  mulk:{ar:"سُورَةُ المُلْك",ms:"Surah Al-Mulk, recite once",short:"Al-Mulk",target:1}
};
const SLOTS = [
  {id:"subuh",name:"Subuh",tab:"After Subuh",sub:"After Fajr",items:["z1","z2","z3"]},
  {id:"asar",name:"Asar",tab:"After Asar",sub:"After Asr",items:["z1","z2","z3"]},
  {id:"isyak",name:"Isyak",tab:"After Isyak",sub:"After Isha",items:["mulk"]}
];
const DAYS_MS=["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];
const MONTHS_MS=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
const KEY="zikir.v1";
let store={days:{}};
try{store=JSON.parse(localStorage.getItem(KEY))||store}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const dkey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>dkey(new Date());
const dayData=k=>store.days[k]||(store.days[k]={});
const cnt=(k,s,i)=>(store.days[k]&&store.days[k][s+":"+i])||0;
const slotDone=(k,s)=>SLOTS.find(x=>x.id===s).items.every(i=>cnt(k,s,i)>=ITEMS[i].target);
const dayTotals=k=>{let d=0,t=0;SLOTS.forEach(s=>s.items.forEach(i=>{t+=ITEMS[i].target;d+=Math.min(cnt(k,s.id,i),ITEMS[i].target)}));return d/t};

const h=new Date().getHours();
let slot=h<12?"subuh":h<19?"asar":"isyak";
const sel={subuh:0,asar:0,isyak:0};

function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

function tap(){
  const s=SLOTS.find(x=>x.id===slot),item=s.items[sel[slot]],k=today(),d=dayData(k),key=slot+":"+item,T=ITEMS[item].target;
  const c=d[key]||0;
  if(item==="mulk"){d[key]=c>=1?0:1;save();vib(d[key]?[30,40,30]:10);if(d[key])toast("Masha'Allah, Al-Mulk done");render();return}
  if(c>=T)return;
  d[key]=c+1;save();
  if(d[key]>=T){
    vib([60,50,60]);
    const nxt=s.items.findIndex((i,ix)=>ix>sel[slot]&&cnt(k,slot,i)<ITEMS[i].target);
    if(slotDone(k,slot))toast("Alhamdulillah, "+s.name+" complete");
    else if(nxt>=0){sel[slot]=nxt;toast("Done. Next zikir")}
  }else vib(c%33===32?[40,30,40]:8);
  render();
}
function curItem(){const s=SLOTS.find(x=>x.id===slot),i=s.items[sel[slot]];return {s,i,key:slot+":"+i,T:ITEMS[i].target}}
function openAdd(){
  const {s,i,key,T}=curItem(),c=cnt(today(),slot,i);
  document.getElementById("sheetSub").textContent=`${s.tab} · now ${c} of ${T}. Enter what you counted elsewhere (e.g. with beads).`;
  const inp=document.getElementById("addN");inp.value="";
  document.getElementById("sheet").classList.add("show");setTimeout(()=>inp.focus(),50);
}
function closeAdd(){document.getElementById("sheet").classList.remove("show")}
function setAdd(n){const {i}=curItem(),rem=ITEMS[i].target-cnt(today(),slot,i);document.getElementById("addN").value=Math.max(0,Math.min(n,rem))||""}
function doAdd(){
  const n=parseInt(document.getElementById("addN").value,10);
  if(!n||n<1){toast("Enter a number");return}
  const k=today(),d=dayData(k),{s,i,key,T}=curItem(),c=d[key]||0;
  d[key]=Math.min(T,c+n);save();closeAdd();
  if(d[key]>=T){
    vib([60,50,60]);
    const nxt=s.items.findIndex((x,ix)=>ix>sel[slot]&&cnt(k,slot,x)<ITEMS[x].target);
    if(slotDone(k,slot))toast("Alhamdulillah, "+s.name+" complete");
    else if(nxt>=0){sel[slot]=nxt;toast("Added. Next zikir")}
    else toast("Added");
  }else toast("Added "+n);
  render();
}
function minus(){const k=today(),d=dayData(k),s=SLOTS.find(x=>x.id===slot),i=s.items[sel[slot]],key=slot+":"+i;if(d[key]>0){d[key]--;save();render()}}
function resetItem(){const k=today(),d=dayData(k),s=SLOTS.find(x=>x.id===slot),i=s.items[sel[slot]];if(confirm("Reset this counter to 0?")){d[slot+":"+i]=0;save();render()}}

function streak(){
  let n=0,d=new Date();
  if(dayTotals(dkey(d))<1)d.setDate(d.getDate()-1);
  while(dayTotals(dkey(d))>=1){n++;d.setDate(d.getDate()-1)}
  return n;
}

function render(){
  renderPrayer();renderKahf();
  const k=today(),now=new Date();
  const _t=dayTimes(now);document.getElementById("date").innerHTML=`${DAYS_MS[now.getDay()]}, ${now.getDate()} ${MONTHS_MS[now.getMonth()]} ${now.getFullYear()}`+(_t&&_t.hijri?`<div class="hj">${hijriStr(_t.hijri)}${_t.src==="aladhan"?" (approx.)":""}</div>`:"");
  document.getElementById("streak").textContent="💎 "+streak()+" day"+(streak()===1?"":"s");
  // week strip
  let w="";
  const wk0=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()); // week starts Ahad
  for(let i=0;i<7;i++){const d=new Date(wk0.getFullYear(),wk0.getMonth(),wk0.getDate()+i),kk=dkey(d),p=dayTotals(kk),isToday=kk===k,future=kk>k;
    w+=`<div class="day ${isToday?"today":""} ${p>=1?"full":""} ${future?"future":""}">${DAYS_MS[i][0]}</div>`}
  document.getElementById("week").innerHTML=w;
  // tabs
  document.getElementById("tabs").innerHTML=SLOTS.map(s=>{const dn=s.items.filter(i=>cnt(k,s.id,i)>=ITEMS[i].target).length;return `<button class="tab ${s.id===slot?"active":""} ${slotDone(k,s.id)?"done":""}" onclick="slot='${s.id}';render()">${s.tab}<small>${slotDone(k,s.id)?"✓ done":dn+"/"+s.items.length+" done"}</small></button>`}).join("");
  // main
  const s=SLOTS.find(x=>x.id===slot),itemId=s.items[sel[slot]],it=ITEMS[itemId],c=cnt(k,slot,itemId),T=it.target;
  let html="";
  if(s.items.length>1){
    html+=`<div class="chips">`+s.items.map((i,ix)=>`<button class="chip ${ix===sel[slot]?"sel":""} ${cnt(k,slot,i)>=ITEMS[i].target?"done":""}" onclick="sel['${slot}']=${ix};render()"><span class="a">${ITEMS[i].short}</span>${cnt(k,slot,i)}/${ITEMS[i].target}</button>`).join("")+`</div>`;
  }
  if(itemId==="mulk"){
    html+=`<div class="hero" onclick="tap()"><p class="ar big">${it.ar}</p><p class="ms">${it.ms}</p>
    <div class="mulk-btn ${c?"on":""}">${c?"✓":"۝"}</div>
    <div class="${c?"complete":"hint"}">${c?"Completed tonight":"Tap after you finish reciting"}</div></div>`;
  }else{
    const R=88,C=2*Math.PI*R,off=C*(1-Math.min(c/T,1));
    html+=`<div class="hero" onclick="tap()"><p class="ar">${it.ar}</p><p class="ms">${it.ms}</p>
    <div class="ring"><svg width="150" height="150" viewBox="0 0 190 190"><circle cx="95" cy="95" r="${R}" fill="none" stroke="#dcece3" stroke-width="10"/><circle cx="95" cy="95" r="${R}" fill="none" stroke="${c>=T?"#5cbf8a":"#e39a73"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .15s"/></svg>
    <div class="num"><b>${c}</b><span>of ${T}</span></div></div>
    <div class="${c>=T?"complete":"hint"}">${c>=T?"Completed ✓":"Tap anywhere to count"}</div></div>
    <div class="actions"><button class="btn" onclick="minus()">− Undo one</button><button class="btn plus" onclick="openAdd()">+ Add count</button><button class="btn" onclick="resetItem()">Reset</button></div>`;
  }
  document.getElementById("main").innerHTML=html;
}
/* ---------- Prayer times + reminders (JAKIM via waktusolat.app) ---------- */
const PK="zikir.prayer.v1";
const FALLBACK={lat:1.5373,lng:104.2297}; // Bandar Penawar, Johor
const OFFSETS=[0,10,20,30];
let pr={lat:null,lng:null,zone:null,m3:{},notify:false,offset:10,fired:{},azanOn:false,azan:"makkah"};
try{Object.assign(pr,JSON.parse(localStorage.getItem(PK))||{})}catch(e){}
const savePr=()=>{try{localStorage.setItem(PK,JSON.stringify(pr))}catch(e){}};
const PNAMES={maghrib:"Maghrib",isyak:"Isyak",subuh:"Subuh",syuruk:"Syuruk",dhuha:"Dhuha",zohor:"Zohor",asar:"Asar"};
const ORDER=["maghrib","isyak","subuh","syuruk","dhuha","zohor","asar"];
const HMONTHS=["Muharram","Safar","Rabiulawal","Rabiulakhir","Jamadilawal","Jamadilakhir","Rejab","Syaaban","Ramadan","Syawal","Zulkaedah","Zulhijjah"];
let prayerStatus="loading";

function hijriStr(h){const[y,m,d]=h.split("-").map(Number);return `${d} ${HMONTHS[m-1]||m} ${y}H`}
function ymKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function dayTimes(d){
  const m=pr.m3&&pr.m3[ymKey(d)];const r=m&&m.days&&m.days[d.getDate()-1];if(!r)return null;
  return {subuh:new Date(r.f),syuruk:new Date(r.s),dhuha:new Date(r.s+28*60000),zohor:new Date(r.d),asar:new Date(r.a),maghrib:new Date(r.m),isyak:new Date(r.i),hijri:r.h,src:m.src};
}
function fmt(t){return String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")}
function ptime(id){const t=dayTimes(new Date());return t?fmt(t[id]):null}

// value may be epoch seconds/ms (number) or "HH:MM[:SS]" (string)
function toMs(v,y,mo,day){
  if(typeof v==="number")return v<1e12?v*1000:v;
  const[h,mi]=String(v).split(":").map(Number);return new Date(y,mo-1,day,h,mi).getTime();
}
async function fetchJakim(d){
  const y=d.getFullYear(),mo=d.getMonth()+1,lat=pr.lat??FALLBACK.lat,lng=pr.lng??FALLBACK.lng;
  const url=pr.zone?`https://api.waktusolat.app/v2/solat/${pr.zone}?year=${y}&month=${mo}`:`https://api.waktusolat.app/v2/solat/gps/${lat}/${lng}`;
  const res=await fetch(url);if(!res.ok)throw new Error("http "+res.status);
  const j=await res.json();
  const arr=j.prayers||j.prayerTime||j.data;if(!Array.isArray(arr)||arr.length<28)throw new Error("shape");
  if(arr.length!==new Date(y,mo,0).getDate())throw new Error("days "+arr.length);
  const days=[];
  arr.forEach((x,i)=>{const dn=(typeof x.day==="number"?x.day:i+1)-1;
    days[dn]={h:x.hijri,f:toMs(x.fajr,y,mo,dn+1),s:toMs(x.syuruk,y,mo,dn+1),d:toMs(x.dhuhr,y,mo,dn+1),a:toMs(x.asr,y,mo,dn+1),m:toMs(x.maghrib,y,mo,dn+1),i:toMs(x.isha,y,mo,dn+1)}});
  if(j.zone)pr.zone=j.zone;
  return {src:"jakim",days};
}
async function fetchEsolat(d){ // JAKIM e-solat official API (current month only)
  const now=new Date();if(ymKey(d)!==ymKey(now))throw new Error("month");
  const lat=pr.lat??FALLBACK.lat,lng=pr.lng??FALLBACK.lng;
  const zone=pr.zone||((lat>1.2&&lat<2.9&&lng>102.4&&lng<104.6)?"JHR02":null);if(!zone)throw new Error("zone");
  const res=await fetch(`https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&period=month&zone=${zone}`);
  const j=await res.json();const arr=j.prayerTime;if(!Array.isArray(arr)||arr.length<28)throw new Error("shape");
  const y=d.getFullYear(),mo=d.getMonth()+1;
  pr.zone=zone;
  return {src:"jakim",days:arr.map((x,i)=>({h:x.hijri,f:toMs(x.fajr,y,mo,i+1),s:toMs(x.syuruk,y,mo,i+1),d:toMs(x.dhuhr,y,mo,i+1),a:toMs(x.asr,y,mo,i+1),m:toMs(x.maghrib,y,mo,i+1),i:toMs(x.isha,y,mo,i+1)}))};
}
async function fetchAladhan(d){ // fallback; Hijri date here is approximate, not JAKIM
  const y=d.getFullYear(),mo=d.getMonth()+1,lat=pr.lat??FALLBACK.lat,lng=pr.lng??FALLBACK.lng;
  const res=await fetch(`https://api.aladhan.com/v1/calendar/${y}/${mo}?latitude=${lat}&longitude=${lng}&method=17`);
  const j=await res.json();const p2=n=>String(n).padStart(2,"0");
  return {src:"aladhan",days:j.data.map((x,i)=>{const t=x.timings,g=k=>toMs(t[k].slice(0,5),y,mo,i+1),hj=x.date.hijri;
    return {h:`${hj.year}-${p2(hj.month.number)}-${p2(hj.day)}`,f:g("Fajr"),s:g("Sunrise"),d:g("Dhuhr"),a:g("Asr"),m:g("Maghrib"),i:g("Isha")}})};
}
async function loadMonth(d){
  const ym=ymKey(d);if(pr.m3[ym]&&pr.m3[ym].src==="jakim")return true;
  let data=null,errs=[];
  try{data=await fetchJakim(d)}catch(e){errs.push("A:"+e.message);try{data=await fetchEsolat(d)}catch(e2){errs.push("B:"+e2.message);if(pr.m3[ym])data=pr.m3[ym];else try{data=await fetchAladhan(d)}catch(_){}}}
  pr.err=data&&data.src==="jakim"?"":errs.join(" ");
  if(!data)return false;
  pr.m3[ym]=data;Object.keys(pr.m3).sort().slice(0,-2).forEach(k=>delete pr.m3[k]);delete pr.months;savePr();return true;
}
async function initPrayer(){
  const now=new Date(),nxt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const ok=await loadMonth(now);if(ymKey(nxt)!==ymKey(now))await loadMonth(nxt);
  prayerStatus=ok||dayTimes(now)?"ok":"offline";
  render();
}
function getLoc(){
  if(!navigator.geolocation){toast("Location not supported");initPrayer();return}
  toast("Getting your location…");
  navigator.geolocation.getCurrentPosition(p=>{
    pr.lat=+p.coords.latitude.toFixed(4);pr.lng=+p.coords.longitude.toFixed(4);pr.m3={};pr.zone=null;savePr();
    toast("Location updated");initPrayer();
  },()=>{toast("Location denied – using Bandar Penawar");initPrayer()},{timeout:10000,maximumAge:3600000});
}
function allEvents(){
  const now=new Date(),out=[];
  for(let i=0;i<2;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),t=dayTimes(d);
    if(t)ORDER.forEach(id=>out.push({id,t:t[id]}))}
  return out.sort((a,b)=>a.t-b.t);
}
function nextEvent(){const now=new Date();return allEvents().find(e=>e.t>now)}
function renderPrayer(){
  const el=document.getElementById("prayer");if(!el)return;
  const ev=nextEvent(),t=dayTimes(new Date()),now=new Date();let main,sub;
  if(ev){const mins=Math.max(0,Math.round((ev.t-now)/60000)),hh=Math.floor(mins/60),mm=mins%60;
    main=`Next: ${PNAMES[ev.id]} ${fmt(ev.t)}`;sub=`in ${hh?hh+"h ":""}${mm}m`+(t?` · ${pr.zone?pr.zone+" ":""}${t.src==="jakim"?"JAKIM":"approx."}${t.src!=="jakim"&&pr.err?" ("+pr.err+")":""}`:"")}
  else{main=prayerStatus==="offline"?"Prayer times unavailable":"Loading prayer times…";sub=prayerStatus==="offline"?"Connect once to download this month":"JAKIM"}
  const strip=t?`<div class="pstrip">`+ORDER.map((id,ix)=>{const f=fmt(t[id]).split(" ");return `<div class="pc ${ix<3?"w4":""} ${ev&&ev.id===id?"next":t[id]<now?"passed":""}">${PNAMES[id]}<b>${f[0]}<i>${f[1]||""}</i></b></div>`}).join("")+`</div>`:"";
  el.innerHTML=`<div class="prow"><div class="pinfo"><b>${main}</b><span>${sub}</span></div>
  <button onclick="cycleOffset()" title="Minutes after azan">⏱ ${pr.offset}m</button>
  <button class="${pr.notify?"on":""}" onclick="toggleNotify()">${pr.notify?"🔔":"🔕"}</button>
  <button onclick="getLoc()">📍</button></div>${strip}`;
}
function cycleOffset(){pr.offset=OFFSETS[(OFFSETS.indexOf(pr.offset)+1)%OFFSETS.length];savePr();render()}
async function toggleNotify(){
  if(pr.notify){pr.notify=false;savePr();render();toast("Reminders off");return}
  if(!("Notification" in window)){toast("Notifications not supported here");return}
  let p=Notification.permission;if(p!=="granted")p=await Notification.requestPermission();
  if(p==="granted"){pr.notify=true;savePr();render();toast("Reminders on");checkReminders()}
  else toast("Notification permission denied");
}
async function notify(title,body,tag){
  try{const reg=await navigator.serviceWorker.ready;await reg.showNotification(title,{body,tag,icon:"icon-192.png",badge:"icon-192.png",vibrate:[100,60,100]});}
  catch(e){try{new Notification(title,{body,tag,icon:"icon-192.png"})}catch(_){}}
}
function checkReminders(){
  if(!pr.notify||Notification.permission!=="granted")return;
  const now=new Date(),t=dayTimes(now);if(!t)return;
  ["subuh","asar","isyak"].forEach(id=>{
    const at=new Date(t[id].getTime()+pr.offset*60000),k=today()+id;
    if(now>=at&&now<new Date(at.getTime()+30*60000)&&!pr.fired[k]&&!slotDone(today(),id)){
      pr.fired[k]=1;Object.keys(pr.fired).slice(0,-12).forEach(x=>delete pr.fired[x]);savePr();
      notify(id==="isyak"?"Time for Surah Al-Mulk":`Time for ${PNAMES[id]} zikir`,id==="isyak"?"Recite once after Isha prayer":"Subhanallah, Alhamdulillah, Istighfar, Selawat – 100x each",k);
    }
  });
}
/* ---------- Azan (plays in-app at Zohor, Asar, Maghrib, Isyak) ---------- */
const AZ={makkah:{f:"azan-makkah.mp3"},a2:{f:"azan-2.mp3"},a3:{f:"azan-3.mp3"}};
const AZAN_IDS=["subuh","zohor","asar","maghrib","isyak"];
const AZ_SUBUH="azan-subuh.mp3";
const azAudio=new Audio();azAudio.preload="auto";
["play","pause","ended"].forEach(ev=>azAudio.addEventListener(ev,()=>updAzan()));
let azUnlocked=false;
function unlockAudio(){ // iOS needs one user gesture before audio can start by itself later
  if(azUnlocked)return;azUnlocked=true;
  azAudio.src=AZ[pr.azan].f;azAudio.muted=true;
  azAudio.play().then(()=>{azAudio.pause();azAudio.currentTime=0;azAudio.muted=false}).catch(()=>{azAudio.muted=false;azUnlocked=false});
}
["touchend","click"].forEach(e=>document.addEventListener(e,unlockAudio,{passive:true}));
function playAzan(name,id){
  azAudio.muted=false;azAudio.src=id==="subuh"?AZ_SUBUH:AZ[pr.azan].f;azAudio.currentTime=0;
  azAudio.play().then(()=>{if(name)toast("Azan "+name)}).catch(()=>toast("Tap the screen once to allow azan sound"));
}
function stopAzan(){azAudio.pause();azAudio.currentTime=0}
function testAzan(){azUnlocked=true;if(!azAudio.paused&&!azAudio.muted){stopAzan();return}playAzan()}
function toggleAzan(){pr.azanOn=!pr.azanOn;savePr();updAzan();toast(pr.azanOn?"Azan on – keep the app open":"Azan off");if(pr.azanOn)unlockAudio()}
function setAz(v){pr.azan=v;savePr();stopAzan();azAudio.src=AZ[v].f}
function updAzan(){
  const tg=document.getElementById("azTog"),pl=document.getElementById("azPlay"),sel=document.getElementById("azSel");if(!tg)return;
  tg.textContent="🔊 Azan: "+(pr.azanOn?"On":"Off");tg.classList.toggle("on",!!pr.azanOn);
  pl.textContent=(!azAudio.paused&&!azAudio.muted)?"⏹ Stop":"▶ Test";sel.value=pr.azan;
}
function checkAzan(){
  if(!pr.azanOn)return;const now=new Date(),t=dayTimes(now);if(!t)return;
  AZAN_IDS.forEach(id=>{const at=t[id],k=today()+"az"+id;
    if(now>=at&&now<new Date(at.getTime()+3*60000)&&!pr.fired[k]){
      pr.fired[k]=1;Object.keys(pr.fired).slice(0,-24).forEach(x=>delete pr.fired[x]);savePr();playAzan(PNAMES[id],id);
    }});
}
/* ---------- Surah Al-Kahf: Thursday Maghrib -> Friday Maghrib ---------- */
function kahfKey(now){
  const t=dayTimes(now);if(!t)return null;const d=now.getDay();
  if(d===4&&now>=t.maghrib)return dkey(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1));
  if(d===5&&now<t.maghrib)return dkey(now);
  return null;
}
function kahfEnd(now){
  const d=now.getDay(),f=d===5?now:new Date(now.getFullYear(),now.getMonth(),now.getDate()+1),t=dayTimes(f);return t?t.maghrib:null;
}
function renderKahf(){
  const el=document.getElementById("kahf");if(!el)return;
  const now=new Date(),key=kahfKey(now);
  if(!key){el.innerHTML="";return}
  const done=!!(store.kahf&&store.kahf[key]),end=kahfEnd(now);
  el.innerHTML=`<div class="kahf ${done?"done":""}" onclick="toggleKahf()"><div class="ka">سُورَةُ الْكَهْفِ</div><div class="kt"><b>Surah Al-Kahf${done?" ✓":""}</b><span>${done?"Done for this Jumaat":"Recite before Maghrib"+(end?" "+fmt(end):"")+" on Friday"}</span></div><div class="kc">${done?"✓":""}</div></div>`;
}
function toggleKahf(){
  const key=kahfKey(new Date());if(!key)return;
  store.kahf=store.kahf||{};store.kahf[key]=store.kahf[key]?0:1;save();
  if(store.kahf[key]){vib([30,40,30]);toast("Masha'Allah, Al-Kahf done")}
  renderKahf();
}
function checkKahf(){
  if(!pr.notify||typeof Notification==="undefined"||Notification.permission!=="granted")return;
  const now=new Date(),t=dayTimes(now),key=kahfKey(now);if(!t||!key||(store.kahf&&store.kahf[key]))return;
  const d=now.getDay(),mk=d===4?"kahfThu":"kahfFri",at=new Date((d===4?t.maghrib:t.asar).getTime()+pr.offset*60000),fk=today()+mk;
  if(now>=at&&!pr.fired[fk]){pr.fired[fk]=1;savePr();
    notify("Surah Al-Kahf",d===4?"Jumaat has begun – recite Al-Kahf any time until Friday Maghrib":"Last stretch – recite Al-Kahf before Maghrib today",fk)}
}
updAzan();
setInterval(()=>{renderPrayer();checkReminders();checkAzan();checkKahf()},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){initPrayer();checkReminders();checkAzan();checkKahf()}});
if(pr.lat==null&&"geolocation" in navigator)getLoc();else initPrayer();

render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
</script>
